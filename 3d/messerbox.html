<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anirius Messerbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e8e4; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  p { position: fixed; left: 16px; right: 16px; bottom: 70px; margin: 0; text-align: center; color: #777; pointer-events: none; }
  .touch { display: none; }
  @media (hover: none), (max-width: 720px) { .mouse { display: none; } .touch { display: inline; } p { bottom: 24px; left: 64px; right: 16px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p><span class="mouse">Ziehen zum Drehen · Scrollen zum Zoomen</span><span class="touch">Wischen zum Drehen · Zwei Finger zum Zoomen</span></p>
<script src="box-model.js"></script>
<style>
#ak-back{position:fixed;bottom:16px;left:16px;z-index:2147483647;display:flex;align-items:center;gap:6px;padding:9px 14px 9px 11px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;font:500 14px/1 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.18);transition:transform .25s ease,opacity .25s ease}
@media (max-width:720px){#ak-back{padding:0;width:40px;height:40px;justify-content:center;top:auto;bottom:max(16px,env(safe-area-inset-bottom));left:12px}#ak-back span{display:none}}
#ak-back.ak-hide{transform:translateY(80px);opacity:0;pointer-events:none}
</style><a id="ak-back" href="../" aria-label="Zurück zur Übersicht"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Zurück</span></a><script>(function(){var b=document.getElementById('ak-back'),y=scrollY;addEventListener('scroll',function(){var n=scrollY,d=n-y;if(n<120||d<-6)b.classList.remove('ak-hide');else if(d>6)b.classList.add('ak-hide');if(Math.abs(d)>6||n<120)y=n},{passive:true})})();</script></body>
</html>
