<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anirius 3D-Modell (neu)</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px system-ui, sans-serif; }
  body { background: radial-gradient(ellipse 70% 60% at 50% 45%, #fbfbfa 0%, #efeeeb 55%, #e2e1dd 100%); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  nav { position: fixed; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; padding: 0 16px; }
  .views { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 2px 14px rgba(0,0,0,.1); }
  .views button { border: 0; background: none; font: inherit; color: #55524c; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: #1a1a1b; color: #fff; }
  #farben { display: flex; gap: 10px; }
  #farben[hidden] { display: none; }
  #farben button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #c9c6bf; cursor: pointer; padding: 0; }
  #farben button[aria-pressed="true"] { box-shadow: 0 0 0 2px #1a1a1b; }
  @media (max-width: 720px) { nav { bottom: 68px; } } /* room for the overview's back button */
  button:focus-visible { outline: 2px solid #2a6cdf; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav>
  <div class="views">
    <button data-mode="messer">Messer</button>
    <button data-mode="box">Box</button>
    <button data-mode="offen">Box offen</button>
  </div>
  <div id="farben" hidden>
    <button data-color="black" style="background:#19191b" aria-label="Schwarze Box"></button>
    <button data-color="white" style="background:#e6e6e3" aria-label="Weiße Box"></button>
  </div>
</nav>
<script src="modell.js"></script>
<style>
#ak-back{position:fixed;bottom:16px;left:16px;z-index:2147483647;display:flex;align-items:center;gap:6px;padding:9px 14px 9px 11px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;font:500 14px/1 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.18);transition:transform .25s ease,opacity .25s ease}
@media (max-width:720px){#ak-back{padding:0;width:40px;height:40px;justify-content:center;top:auto;bottom:max(16px,env(safe-area-inset-bottom));left:12px}#ak-back span{display:none}}
#ak-back.ak-hide{transform:translateY(80px);opacity:0;pointer-events:none}
</style><a id="ak-back" href="../" aria-label="Zurück zur Übersicht"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Zurück</span></a><script>(function(){var b=document.getElementById('ak-back'),y=scrollY;addEventListener('scroll',function(){var n=scrollY,d=n-y;if(n<120||d<-6)b.classList.remove('ak-hide');else if(d>6)b.classList.add('ak-hide');if(Math.abs(d)>6||n<120)y=n},{passive:true})})();</script></body>
</html>
